<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NMU Exam Scheduler</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>window.XLSX || document.write('<script src="vendor/xlsx.full.min.js"><\/script>');</script>
<script src="solver.js"></script>
<script src="i18n.js"></script>
</head>
<body>
<header class="top">
  <div class="brand">
    <div class="logo">NMU</div>
    <div class="brand-text">
      <h1 data-i18n="app.title">Exam Scheduler</h1>
      <p class="sub" data-i18n="app.sub"></p>
    </div>
    <div class="top-tools">
      <button id="langBtn" class="tool-btn" type="button"></button>
      <button id="themeBtn" class="tool-btn" type="button"></button>
    </div>
  </div>
  <nav class="tabs" id="tabs">
    <button data-mode="midterm" class="active" data-i18n="tab.midterm">Midterm</button>
    <button data-mode="final" data-i18n="tab.final">Final</button>
  </nav>
</header>

<main id="main">
  <div class="row wrap toolbar">
    <p class="hint reorder-hint" data-i18n="hint.reorder"></p>
    <button id="foldAll" class="btn small" data-i18n="btn.foldAll"></button>
    <button id="openAll" class="btn small" data-i18n="btn.openAll"></button>
  </div>

  <section class="card sec" data-sec="enroll">
    <h2><span class="num"></span><span class="sec-title" data-i18n="sec.enroll"></span></h2>
    <div class="sec-body">
      <p class="hint" data-i18n="enroll.hint"></p>
      <div class="row">
        <label class="file-btn"><span data-i18n="enroll.choose"></span><input type="file" id="enrFile" accept=".xlsx,.xls,.csv"></label>
        <span id="enrInfo" class="muted"></span>
      </div>
      <div id="colMap" class="row wrap hidden"></div>
    </div>
  </section>

  <section class="card sec" data-sec="extra">
    <h2><span class="num"></span><span class="sec-title" data-i18n="sec.extra"></span></h2>
    <div class="sec-body">
      <p class="hint" data-i18n="extra.hint"></p>
      <div class="scroll"><table class="tbl" id="extraTbl">
        <thead><tr><th data-i18n="th.code"></th><th data-i18n="th.cname"></th><th data-i18n="th.ids"></th><th></th></tr></thead>
        <tbody></tbody>
      </table></div>
      <button id="addExtra" class="btn" data-i18n="btn.addCourse"></button>
    </div>
  </section>

  <section class="card sec" data-sec="rooms">
    <h2><span class="num"></span><span class="sec-title" data-i18n="sec.rooms"></span></h2>
    <div class="sec-body">
      <p class="hint" id="roomsHint"></p>
      <div class="row wrap">
        <label class="inline"><span data-i18n="rooms.count"></span><input type="number" id="roomCount" min="0" max="500" value="30"></label>
        <label class="inline"><span data-i18n="rooms.seats"></span><input type="number" id="roomSeats" min="1" value="25"></label>
        <button id="makeRooms" class="btn" data-i18n="rooms.set"></button>
        <button id="allSeats" class="btn small" data-i18n="rooms.allSeats"></button>
        <button id="addRoom" class="btn small" data-i18n="rooms.addOne"></button>
        <button id="copyRooms" class="btn small"></button>
      </div>
      <div id="roomTotal"></div>
      <details class="adv"><summary data-i18n="rooms.edit"></summary>
        <div class="scroll short"><table class="tbl" id="roomTbl">
          <thead><tr><th data-i18n="th.room"></th><th data-i18n="th.seats"></th><th></th></tr></thead><tbody></tbody>
        </table></div>
      </details>
    </div>
  </section>

  <section class="card sec" data-sec="period">
    <h2><span class="num"></span><span class="sec-title" data-i18n="sec.period"></span></h2>
    <div class="sec-body">
      <div class="grid2">
        <label><span data-i18n="period.first"></span><input type="date" id="start"></label>
        <label><span data-i18n="period.last"></span><input type="date" id="end"></label>
      </div>
      <div class="field">
        <span class="lbl" data-i18n="period.weekdays"></span>
        <div id="weekdays" class="row wrap"></div>
      </div>
      <div class="grid2">
        <label><span><span data-i18n="period.holidays"></span> <span class="muted" data-i18n="period.perLine"></span></span><textarea id="holidays" rows="2" placeholder="2027-01-07"></textarea><span id="holidayTip"></span></label>
        <label><span><span data-i18n="period.extra"></span> <span class="muted" data-i18n="period.perLine"></span></span><textarea id="extraDays" rows="2" placeholder="2026-11-14"></textarea></label>
      </div>
      <label class="field"><span data-i18n="period.slots"></span><textarea id="slots" rows="4" dir="ltr"></textarea></label>
      <div id="dayList" class="daylist"></div>
    </div>
  </section>

  <section class="card sec" data-sec="fixed">
    <h2><span class="num"></span><span class="sec-title" data-i18n="sec.fixed"></span></h2>
    <div class="sec-body">
      <p class="hint" data-i18n="fixed.hint"></p>
      <div class="scroll"><table class="tbl" id="fixedTbl">
        <thead><tr><th data-i18n="th.code"></th><th data-i18n="th.course"></th><th data-i18n="th.students"></th><th data-i18n="th.day"></th><th data-i18n="th.time"></th><th></th></tr></thead>
        <tbody></tbody>
      </table></div>
      <div class="row wrap">
        <button id="addFixed" class="btn" data-i18n="btn.addFixed"></button>
        <details class="paste">
          <summary data-i18n="paste.summary"></summary>
          <p class="hint" data-i18n-html="paste.hint"></p>
          <textarea id="pasteFixed" rows="4" dir="ltr"></textarea>
          <button id="pasteBtn" class="btn small" data-i18n="paste.add"></button>
          <span id="pasteMsg" class="muted"></span>
        </details>
      </div>
    </div>
  </section>

  <section class="card sec" data-sec="rules">
    <h2><span class="num"></span><span class="sec-title" data-i18n="sec.rules"></span></h2>
    <div class="sec-body">
      <p class="hint" data-i18n="rules.hint"></p>
      <div class="rules">
        <div class="rule">
          <div><b data-i18n="rule.seats.t"></b><span class="muted" data-i18n="rule.seats.d"></span></div>
          <div id="seatInfo" class="rule-val"></div>
        </div>
        <div class="rule">
          <div><b data-i18n="rule.max.t"></b><span class="muted" data-i18n="rule.max.d"></span></div>
          <select id="maxPerDay"></select>
        </div>
        <div class="rule" data-n="2">
          <div><b data-i18n="rule.n2.t"></b><span class="muted" data-i18n="rule.n2.d"></span></div>
          <select id="pen2" class="lvl"></select>
        </div>
        <div class="rule" data-n="3">
          <div><b data-i18n="rule.n3.t"></b><span class="muted" data-i18n="rule.n3.d"></span></div>
          <select id="pen3" class="lvl"></select>
        </div>
        <div class="rule" data-n="4">
          <div><b data-i18n="rule.n4.t"></b><span class="muted" data-i18n="rule.n4.d"></span></div>
          <select id="pen4" class="lvl"></select>
        </div>
        <div class="rule">
          <div><b data-i18n="rule.adj.t"></b><span class="muted" data-i18n="rule.adj.d"></span></div>
          <select id="adjPen"></select>
        </div>
        <div class="rule">
          <div><b data-i18n="rule.extra.t"></b><span class="muted" data-i18n="rule.extra.d"></span></div>
          <select id="extraPen"></select>
        </div>
        <div class="rule">
          <div><b data-i18n="rule.excl.t"></b><span class="muted" data-i18n="rule.excl.d"></span></div>
          <input type="text" id="excluded" data-i18n-ph="ph.excl" dir="ltr">
        </div>
      </div>
      <details class="adv"><summary data-i18n="adv.summary"></summary>
        <div class="grid3">
          <label><span data-i18n="adv.iter"></span> <span class="muted" data-i18n="adv.iter.d"></span><input type="number" id="iterations" min="10000" step="10000"></label>
          <label><span data-i18n="adv.att"></span> <span class="muted" data-i18n="adv.att.d"></span><input type="number" id="restarts" min="1" max="10"></label>
          <label><span data-i18n="adv.bal"></span> <span class="muted" data-i18n="adv.bal.d"></span><input type="number" id="balance" min="0" step="0.01"></label>
        </div>
      </details>
      <div class="row wrap actions">
        <button id="run" class="btn primary" data-i18n="btn.run"></button>
        <span id="runMsg" class="muted"></span>
        <div class="progress hidden" id="progress"><div></div></div>
      </div>
      <div id="warnings"></div>
    </div>
  </section>

  <section class="card sec hidden" data-sec="results" id="results">
    <h2><span class="num"></span><span class="sec-title" data-i18n="sec.results"></span></h2>
    <div class="sec-body">
      <div class="row wrap">
        <button id="printBtn" class="btn" data-i18n="btn.print"></button>
        <span id="genAt" class="muted"></span>
      </div>
      <div class="downloads">
        <span class="lbl" data-i18n="dl.label"></span>
        <div class="row wrap">
          <button class="btn primary" data-dl="all" data-i18n="dl.all"></button>
          <button class="btn" data-dl="detailed" data-i18n="dl.detailed"></button>
          <button class="btn" data-dl="student" data-i18n="dl.student"></button>
          <button class="btn" data-dl="byday" data-i18n="dl.byday"></button>
          <button class="btn" data-dl="heavy" id="dlHeavy"></button>
          <button class="btn" data-dl="rooms" data-i18n="dl.rooms"></button>
        </div>
        <span id="dlMsg" class="muted"></span>
      </div>
      <div id="summary" class="stats"></div>
      <div class="scroll"><table class="grid" id="gridTbl"></table></div>

      <h3><span data-i18n="courses.title"></span> <span class="muted" data-i18n="courses.sub"></span></h3>
      <div class="row"><input type="search" id="courseFilter" data-i18n-ph="ph.filter"></div>
      <div class="scroll"><table class="tbl" id="courseTbl"></table></div>

      <h3><span data-i18n="roomplan.title"></span> <span class="muted" data-i18n="roomplan.sub"></span></h3>
      <div id="roomPlan" class="scroll short"></div>

      <h3 id="heavyTitle"></h3>
      <div class="scroll short"><table class="tbl" id="heavyTbl"></table></div>

      <h3 data-i18n="lookup.title"></h3>
      <div class="row"><input type="search" id="studentSearch" data-i18n-ph="ph.student"></div>
      <div id="studentOut"></div>
    </div>
  </section>

  <section class="card muted-card">
    <div class="row wrap">
      <button id="exportCfg" class="btn small" data-i18n="cfg.save"></button>
      <label class="file-btn small"><span data-i18n="cfg.load"></span><input type="file" id="importCfg" accept=".json"></label>
      <button id="resetCfg" class="btn small danger" data-i18n="cfg.reset"></button>
      <button id="resetOrder" class="btn small" data-i18n="cfg.resetOrder"></button>
      <span class="muted" data-i18n="cfg.auto"></span>
      <span id="cfgMsg"></span>
    </div>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
